name: ci
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create release tags and GitHub releases
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full git history and tags

      - name: Setup Node 📦
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # https://github.com/cypress-io/github-action
      - name: Run tests 🧪
        uses: cypress-io/github-action@v6
        with:
          build: npm run build

      # publishes @simonfischer04/cypress-skip-and-only-ui to npm
      # release branches are configured in package.json "release" field
      - name: Semantic Release 🚀
        if: github.ref == 'refs/heads/dev'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
